name: Bid Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bid_bot.py"
      - "api/**"
      - "pyproject.toml"
      - "vercel.json"
      - ".github/workflows/bid_bot.yml"
  schedule:
    # 06:00, 10:00, 14:00, 18:00 KST
    - cron: "0 1,5,9,21 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Seoul collector
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET GitHub secret is missing"
            exit 1
          fi

          curl --fail-with-body \
            --show-error \
            --silent \
            --max-time 540 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://bid-bot-seven.vercel.app/api/run
